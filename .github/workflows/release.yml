name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.8.1)'
        required: true
      notes:
        description: 'Release notes (Markdown, optional, auto-generated if empty)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The cp lines below are an allowlist. A top-level file or folder missing
      # here never reaches the zip, and tools/package.ps1 parses these same
      # lines, so a locally built zip carries exactly these files too.
      #
      # The asset name is fixed at vendor-analytics-pro-for-hivepress.zip: forum posts link to
      # releases/latest/download/vendor-analytics-pro-for-hivepress.zip, so renaming it would break
      # every published download link.
      - name: Build plugin zip
        run: |
          mkdir -p build/vendor-analytics-pro-for-hivepress
          cp hivepress-vendor-analytics.php uninstall.php readme.txt build/vendor-analytics-pro-for-hivepress/
          cp -r includes assets build/vendor-analytics-pro-for-hivepress/
          if [ -d languages ]; then cp -r languages build/vendor-analytics-pro-for-hivepress/; fi
          cd build
          zip -r vendor-analytics-pro-for-hivepress.zip vendor-analytics-pro-for-hivepress

      - name: Create or refresh the release (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            git tag -f "$TAG" "$GITHUB_SHA"
            git push --force origin "refs/tags/$TAG"
            if [ -n "$NOTES" ]; then
              gh release edit "$TAG" --notes "$NOTES" --repo "$GITHUB_REPOSITORY"
            fi
            gh release upload "$TAG" build/vendor-analytics-pro-for-hivepress.zip --clobber --repo "$GITHUB_REPOSITORY"
          elif [ -n "$NOTES" ]; then
            gh release create "$TAG" build/vendor-analytics-pro-for-hivepress.zip --title "$TAG" --notes "$NOTES" --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" build/vendor-analytics-pro-for-hivepress.zip --title "$TAG" --generate-notes --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          fi

      - name: Upload asset to the release
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" build/vendor-analytics-pro-for-hivepress.zip --clobber --repo "$GITHUB_REPOSITORY"
